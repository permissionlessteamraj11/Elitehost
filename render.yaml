services:
  # =========================================
  # 🌐 EliteHosting Web App
  # =========================================
  - type: web
    name: elitehosting-web
    runtime: node
    plan: free
    branch: main

    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm build

    startCommand: |
      pnpm start

    autoDeploy: true

    
