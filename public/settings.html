<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | EliteHosting</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="/dashboard.html" class="logo">ELITEHOSTING.</a>
            <div class="nav-right">
                <div class="menu-toggle" onclick="toggleMenu()">
                    <div class="hamburger">
                        <span>_</span>
                        <span>-</span>
                        <span>_</span>
                    </div>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="mobile-nav">
            <a href="/dashboard.html">DASHBOARD</a>
            <a href="/manage.html">MANAGE</a>
            <a href="/deploy.html">DEPLOY</a>
            <a href="/ai.html">AI (COMING SOON)</a>
            <a href="/settings.html">SETTINGS</a>
            <hr style="border-color: var(--border-color); margin: 10px 0;">
            <a href="#" onclick="logout()">LOGOUT</a>
        </div>
    </nav>

    <div class="container" style="padding-top: 40px; padding-bottom: 120px;">
        <h2>SETTINGS</h2>

        <div class="panel" style="margin-bottom: 20px;">
            <h3>REFERRAL PROGRAM</h3>
            <p class="text-muted" style="margin-bottom: 20px;">Share your link and earn 30% commission on every purchase!</p>
            <div class="form-group">
                <label>Your Referral Code</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="myReferralCode" readonly>
                    <button class="btn btn-outline" onclick="copyReferral()">COPY</button>
                </div>
            </div>
            <p id="refStats" class="text-success" style="font-size: 12px;"></p>
        </div>

        <div class="panel" style="margin-bottom: 20px;">
            <h3>SUPPORT CHAT</h3>
            <div id="chatWindow" class="chat-container" style="height: 300px; border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 10px;">
                <div id="chatMessages" class="chat-messages"></div>
            </div>
            <form id="chatForm" class="chat-input" style="padding: 0; border: none;">
                <input type="text" id="chatInput" placeholder="How can we help?" required>
                <button type="submit" class="btn btn-primary">SEND</button>
            </form>
        </div>

        <div class="panel">
            <h3>ACCOUNT</h3>
            <button class="btn btn-outline" style="width: 100%; border-color: var(--error); color: var(--error);" onclick="logout()">LOGOUT FROM DEVICE</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="/dashboard.html" class="nav-item">
            <div class="nav-icon">H</div>
            <span>Home</span>
        </a>
        <a href="/manage.html" class="nav-item">
            <div class="nav-icon">M</div>
            <span>Manage</span>
        </a>
        <a href="/deploy.html" class="nav-item">
            <div class="nav-icon">D</div>
            <span>Deploy</span>
        </a>
        <a href="/ai.html" class="nav-item">
            <div class="nav-icon">A</div>
            <span>AI</span>
        </a>
        <a href="/settings.html" class="nav-item active">
            <div class="nav-icon">S</div>
            <span>Settings</span>
        </a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('active');
        }
        function copyReferral() {
            const code = document.getElementById('myReferralCode');
            code.select();
            document.execCommand('copy');
            alert('Referral link copied!');
        }
    </script>
    <script src="/js/settings.js"></script>
</body>
</html>
