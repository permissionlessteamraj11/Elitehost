<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet | EliteHosting</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="/dashboard.html" class="logo">ELITEHOSTING.</a>
            <div class="nav-links">
                <a href="/dashboard.html">DASHBOARD</a>
                <a href="/wallet.html">WALLET</a>
                <a href="/referral.html">REFERRAL</a>
                <a href="/chat.html">CHAT</a>
                <a href="/logout" onclick="logout()">LOGOUT</a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 40px;">
        <h2>WALLET & CREDITS</h2>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <div>
                <div class="panel stat-card" style="margin-bottom: 30px;">
                    <div class="value" id="walletBalance">₹0.00</div>
                    <div class="label">CURRENT BALANCE</div>
                </div>

                <div class="panel" style="margin-bottom: 30px;">
                    <h3>BUY CREDITS</h3>
                    <div style="display: grid; gap: 10px; margin-top: 15px;">
                        <button class="btn btn-outline" onclick="buyPlan('starter')">STARTER (20 CREDITS) - ₹199</button>
                        <button class="btn btn-primary" onclick="buyPlan('pro')">PRO (60 CREDITS) - ₹499</button>
                        <button class="btn btn-outline" onclick="buyPlan('enterprise')">ENTERPRISE (150 CREDITS) - ₹999</button>
                    </div>
                </div>

                <div class="panel">
                    <h3>WITHDRAW FUNDS</h3>
                    <form id="withdrawForm">
                        <div class="form-group">
                            <label>Amount (Min ₹100)</label>
                            <input type="number" id="amount" min="100" required placeholder="100">
                        </div>
                        <div class="form-group">
                            <label>Payment Method</label>
                            <select id="method">
                                <option value="upi">UPI</option>
                                <option value="bank">Bank Transfer</option>
                                <option value="crypto">Crypto (USDT)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Payment Details (UPI ID / A/c No / Wallet Address)</label>
                            <textarea id="details" required placeholder="Enter your payment details..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">REQUEST WITHDRAWAL</button>
                    </form>
                </div>
            </div>

            <div>
                <div class="panel">
                    <h3>TRANSACTION HISTORY</h3>
                    <table id="withdrawalsTable">
                        <thead>
                            <tr>
                                <th>AMOUNT</th>
                                <th>STATUS</th>
                                <th>DATE</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/wallet.js"></script>
</body>
</html>
