<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Chat | EliteHosting</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="/dashboard.html" class="logo">ELITEHOSTING.</a>
            <div class="nav-links">
                <a href="/dashboard.html">DASHBOARD</a>
                <a href="/chat.html">CHAT</a>
                <a href="/logout" onclick="logout()">LOGOUT</a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 40px; max-width: 800px;">
        <h2>SUPPORT CHAT</h2>
        <div class="panel chat-container">
            <div class="chat-messages" id="chatMessages">
                <!-- Messages -->
            </div>
            <div id="waitingMsg" class="text-muted" style="text-align: center; padding: 10px; display: none;">WAITING FOR ADMIN REPLY...</div>
            <form class="chat-input" id="chatForm">
                <input type="text" id="msgInput" placeholder="Type your message here..." required autocomplete="off">
                <button type="submit" class="btn btn-primary">SEND</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
