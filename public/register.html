<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EliteHosting</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body style="height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="panel" style="width: 100%; max-width: 400px;">
        <h2 style="text-align: center;">REGISTER</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="johndoe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Referral Code (Optional)</label>
                <input type="text" id="referralCode" placeholder="RAJ4X2">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">REGISTER</button>
        </form>
        <p class="text-muted" style="text-align: center; margin-top: 20px; font-size: 14px;">
            Already have an account? <a href="/login.html" style="color: #fff; text-decoration: underline;">Login</a>
        </p>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('ref')) {
            document.getElementById('referralCode').value = urlParams.get('ref');
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const referralCode = document.getElementById('referralCode').value;
            await register(username, email, password, referralCode);
        });
    </script>
</body>
</html>
