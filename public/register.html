<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — EliteHost</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="hero-glow"></div>
  <div class="glass-card" style="width: 100%; max-width: 450px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <div class="logo-square" style="margin: 0 auto 16px;">E</div>
      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">Create Account</h2>
      <p class="text-secondary">Start deploying your bots for free</p>
    </div>

    <form id="registerForm">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="John Doe">
      </div>
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <div class="input-group">
        <label>Referral Code (Optional)</label>
        <input type="text" id="referralCode" placeholder="ELITE-XXXXXX">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Create Account</button>
    </form>

    <p style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
      Already have an account? <a href="/login.html" style="color: var(--accent); font-weight: 600;">Sign In →</a>
    </p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const referralCode = document.getElementById('referralCode').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, referralCode })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Registration failed');
      }
    });
  </script>
</body>
</html>
