<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Program | EliteHosting</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="/dashboard.html" class="logo">ELITEHOSTING.</a>
            <div class="nav-links">
                <a href="/dashboard.html">DASHBOARD</a>
                <a href="/referral.html">REFERRAL</a>
                <a href="/logout" onclick="logout()">LOGOUT</a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 40px; text-align: center;">
        <h2>REFER & EARN 30%</h2>
        <p class="text-muted" style="margin-bottom: 40px;">Earn 30% commission on every plan purchase made by your referrals.</p>

        <div class="panel" style="max-width: 600px; margin: 0 auto 40px;">
            <div class="form-group">
                <label>YOUR REFERRAL CODE</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="refCode" readonly style="font-size: 24px; text-align: center; font-weight: bold; letter-spacing: 5px;">
                    <button class="btn btn-primary" onclick="copyRef()">COPY</button>
                </div>
            </div>
            <div class="form-group">
                <label>YOUR REFERRAL LINK</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="refLink" readonly>
                    <button class="btn btn-outline" onclick="copyLink()">COPY</button>
                </div>
            </div>
        </div>

        <div class="stats-grid" style="max-width: 800px; margin: 0 auto;">
            <div class="panel stat-card">
                <div class="value" id="totalReferred">0</div>
                <div class="label">TOTAL REFERRED</div>
            </div>
            <div class="panel stat-card">
                <div class="value" id="totalEarned">₹0.00</div>
                <div class="label">TOTAL EARNED</div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        async function initReferral() {
            const res = await auth.fetch('/api/auth/me');
            if (res.success) {
                const code = res.data.referralCode;
                document.getElementById('refCode').value = code;
                document.getElementById('refLink').value = `${window.location.origin}/register.html?ref=${code}`;
                document.getElementById('totalEarned').innerText = `₹${res.data.wallet.toFixed(2)}`;
                // In a real app we'd fetch actual referral count from a different endpoint
                document.getElementById('totalReferred').innerText = '0';
            }
        }

        function copyRef() {
            const el = document.getElementById('refCode');
            el.select();
            document.execCommand('copy');
            alert('Code copied!');
        }

        function copyLink() {
            const el = document.getElementById('refLink');
            el.select();
            document.execCommand('copy');
            alert('Link copied!');
        }

        document.addEventListener('DOMContentLoaded', initReferral);
    </script>
</body>
</html>
