<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | EliteHosting</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="/dashboard.html" class="logo">ELITEHOSTING.</a>
            <div class="nav-links">
                <a href="/dashboard.html">DASHBOARD</a>
                <a href="/deploy.html">DEPLOY</a>
                <a href="/deployments.html">DEPLOYMENTS</a>
                <a href="/wallet.html">WALLET</a>
                <a href="/referral.html">REFERRAL</a>
                <a href="/chat.html">CHAT</a>
                <a href="#" onclick="logout()">LOGOUT</a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 40px;">
        <h2 id="welcomeText">WELCOME BACK, ...</h2>

        <div class="stats-grid">
            <div class="panel stat-card">
                <div class="value" id="creditsBalance">0</div>
                <div class="label">CREDITS BALANCE</div>
            </div>
            <div class="panel stat-card">
                <div class="value" id="walletBalance">₹0.00</div>
                <div class="label">WALLET BALANCE</div>
            </div>
            <div class="panel stat-card">
                <div class="value" id="activeDeploys">0</div>
                <div class="label">ACTIVE DEPLOYMENTS</div>
            </div>
            <div class="panel stat-card">
                <div class="value" id="trialStatus">NONE</div>
                <div class="label">TRIAL STATUS</div>
            </div>
        </div>

        <div class="panel" style="margin-bottom: 40px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>RECENT DEPLOYMENTS</h3>
                <a href="/deploy.html" class="btn btn-primary btn-sm">+ NEW DEPLOY</a>
            </div>
            <table id="recentDeploymentsTable">
                <thead>
                    <tr>
                        <th>NAME</th>
                        <th>TYPE</th>
                        <th>STATUS</th>
                        <th>CREATED</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
