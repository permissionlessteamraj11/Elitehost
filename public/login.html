<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — EliteHost</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="hero-glow"></div>
  <div class="glass-card" style="width: 100%; max-width: 400px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <div class="logo-square" style="margin: 0 auto 16px;">E</div>
      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">Welcome back</h2>
      <p class="text-secondary">Sign in to your EliteHost account</p>
    </div>

    <form id="loginForm">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>
    </form>

    <div style="margin: 24px 0; text-align: center; position: relative;">
      <hr style="border: 0; border-top: 1px solid var(--border);">
      <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0b0b14; padding: 0 10px; font-size: 11px; color: var(--text-muted);">or</span>
    </div>

    <button class="btn btn-outline" style="width: 100%;" onclick="location.href='/api/auth/github'">
      <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24" style="margin-right: 8px;"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      Continue with GitHub
    </button>

    <p style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
      Don't have an account? <a href="/register.html" style="color: var(--accent); font-weight: 600;">Register →</a>
    </p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Login failed');
      }
    });
  </script>
</body>
</html>
