<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EliteHosting</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body style="height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="panel" style="width: 100%; max-width: 400px;">
        <h2 style="text-align: center;">LOGIN</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">LOGIN</button>
        </form>
        <p class="text-muted" style="text-align: center; margin-top: 20px; font-size: 14px;">
            Don't have an account? <a href="/register.html" style="color: #fff; text-decoration: underline;">Register</a>
        </p>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await login(email, password);
        });
    </script>
</body>
</html>
