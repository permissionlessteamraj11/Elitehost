<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployments | EliteHosting</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="/dashboard.html" class="logo">ELITEHOSTING.</a>
            <div class="nav-links">
                <a href="/dashboard.html">DASHBOARD</a>
                <a href="/deploy.html">DEPLOY</a>
                <a href="/deployments.html">DEPLOYMENTS</a>
                <a href="/logout" onclick="logout()">LOGOUT</a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>YOUR DEPLOYMENTS</h2>
            <a href="/deploy.html" class="btn btn-primary">+ NEW DEPLOY</a>
        </div>

        <div class="panel">
            <table id="deploymentsTable">
                <thead>
                    <tr>
                        <th>NAME</th>
                        <th>TYPE</th>
                        <th>STATUS</th>
                        <th>TRIAL?</th>
                        <th>CREATED</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Logs Modal -->
    <div id="logsModal" class="modal">
        <div class="modal-content panel">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h3 id="modalTitle">DEPLOYMENT LOGS</h3>
                <button class="btn btn-outline" style="border-color: red; color: red;" onclick="closeModal()">CLOSE</button>
            </div>
            <div id="logsContent" style="background: #000; padding: 20px; border-radius: 4px; font-family: monospace; height: 400px; overflow-y: auto; font-size: 14px; white-space: pre-wrap;">
                <!-- Logs here -->
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        async function loadDeployments() {
            const res = await auth.fetch('/api/deploy/list');
            if (res.success) {
                const tableBody = document.querySelector('#deploymentsTable tbody');
                tableBody.innerHTML = '';
                res.data.forEach(deploy => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>
                            ${deploy.name}<br>
                            <small class="text-muted">${deploy.url}</small>
                        </td>
                        <td>${deploy.type.toUpperCase()}</td>
                        <td><span class="badge badge-${deploy.status}">${deploy.status}</span></td>
                        <td>${deploy.isTrial ? '<span class="text-success">YES</span>' : 'NO'}</td>
                        <td>${new Date(deploy.createdAt).toLocaleString()}</td>
                        <td>
                            <button class="btn btn-outline btn-sm" onclick="viewLogs('${deploy.id}')">LOGS</button>
                            ${deploy.status === 'running' ? `<button class="btn btn-outline btn-sm" onclick="stopDeploy('${deploy.id}')">STOP</button>` : ''}
                            <button class="btn btn-outline btn-sm" style="border-color: red; color: red;" onclick="deleteDeploy('${deploy.id}')">DELETE</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }

        async function viewLogs(id) {
            const res = await auth.fetch(`/api/deploy/${id}/logs`);
            if (res.success) {
                const logsDiv = document.getElementById('logsContent');
                logsDiv.innerHTML = res.data.map(l => `[${new Date(l.timestamp).toLocaleTimeString()}] ${l.text}`).join('\n');
                document.getElementById('logsModal').style.display = 'flex';
                logsDiv.scrollTop = logsDiv.scrollHeight;
            }
        }

        function closeModal() {
            document.getElementById('logsModal').style.display = 'none';
        }

        async function stopDeploy(id) {
            if (confirm('Are you sure you want to stop this deployment?')) {
                const res = await auth.fetch(`/api/deploy/${id}/stop`, { method: 'POST' });
                if (res.success) loadDeployments();
            }
        }

        async function deleteDeploy(id) {
            if (confirm('Are you sure you want to DELETE this deployment permanently?')) {
                const res = await auth.fetch(`/api/deploy/${id}`, { method: 'DELETE' });
                if (res.success) loadDeployments();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadDeployments();

            // Check if specific ID in URL
            const params = new URLSearchParams(window.location.search);
            if (params.has('id')) {
                viewLogs(params.get('id'));
            }
        });
    </script>
</body>
</html>
