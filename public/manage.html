<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Deployments | EliteHosting</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="/dashboard.html" class="logo">ELITEHOSTING.</a>
            <div class="nav-right">
                <div class="menu-toggle" onclick="toggleMenu()">
                    <div class="hamburger">
                        <span>_</span>
                        <span>-</span>
                        <span>_</span>
                    </div>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="mobile-nav">
            <a href="/dashboard.html">DASHBOARD</a>
            <a href="/manage.html">MANAGE</a>
            <a href="/deploy.html">DEPLOY</a>
            <a href="/ai.html">AI (COMING SOON)</a>
            <a href="/settings.html">SETTINGS</a>
            <hr style="border-color: var(--border-color); margin: 10px 0;">
            <a href="#" onclick="logout()">LOGOUT</a>
        </div>
    </nav>

    <div class="container" style="padding-top: 40px; padding-bottom: 100px;">
        <h2>MANAGE DEPLOYMENTS</h2>

        <div id="deploymentsList" style="display: grid; gap: 20px; margin-top: 20px;">
            <!-- Loaded via JS -->
        </div>
    </div>

    <!-- Logs Modal -->
    <div id="logsModal" class="modal">
        <div class="modal-content panel" style="display: flex; flex-direction: column; height: 80vh;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h3>DEPLOYMENT LOGS</h3>
                <button class="btn btn-outline" onclick="closeLogs()">CLOSE</button>
            </div>
            <div id="logsContent" style="flex: 1; background: #000; padding: 20px; font-family: monospace; overflow-y: auto; font-size: 12px; white-space: pre-wrap;"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="/dashboard.html" class="nav-item">
            <div class="nav-icon">H</div>
            <span>Home</span>
        </a>
        <a href="/manage.html" class="nav-item active">
            <div class="nav-icon">M</div>
            <span>Manage</span>
        </a>
        <a href="/deploy.html" class="nav-item">
            <div class="nav-icon">D</div>
            <span>Deploy</span>
        </a>
        <a href="/ai.html" class="nav-item">
            <div class="nav-icon">A</div>
            <span>AI</span>
        </a>
        <a href="/settings.html" class="nav-item">
            <div class="nav-icon">S</div>
            <span>Settings</span>
        </a>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('active');
        }
    </script>
    <script src="/js/manage.js"></script>
</body>
</html>
